{% extends 'base.html' %}
{% block title %}Chỉnh sửa hồ sơ — VietForum{% endblock %}
{% block content %}
<div style="max-width:480px; margin:0 auto;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
    <a href="/accounts/profile/" style="color:#9ca3af; text-decoration:none; font-size:20px;">←</a>
    <h1 style="font-size:20px; font-weight:800; color:#111827; margin:0;">Chỉnh sửa hồ sơ</h1>
  </div>
  <div class="card" style="padding:24px; box-shadow:0 4px 16px rgba(0,0,0,0.08);">
    <form method="post" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:16px;">
      {% csrf_token %}
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px;">Tên hiển thị</label>
        <input type="text" name="display_name" value="{{ form.display_name.value|default:'' }}">
      </div>
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px;">Email</label>
        <input type="email" name="email" value="{{ form.email.value|default:'' }}">
      </div>
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px;">Ảnh đại diện</label>
        <input type="file" name="avatar_url" accept="image/*" style="font-size:13px; color:#6b7280;">
      </div>
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px;">Giới thiệu</label>
        <textarea name="bio" rows="4" placeholder="Viết vài dòng về bạn...">{{ form.bio.value|default:'' }}</textarea>
      </div>
      <div style="display:flex; gap:12px;">
        <button type="submit" class="btn-primary" style="flex:1; justify-content:center; padding:10px;">Lưu thay đổi</button>
        <a href="/accounts/profile/" class="btn-secondary" style="flex:1; justify-content:center; padding:10px; text-decoration:none;">Hủy</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
