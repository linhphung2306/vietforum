{% extends 'base.html' %}
{% block title %}Quên mật khẩu — VietForum{% endblock %}
{% block content %}
<div style="max-width:400px; margin:0 auto; padding-top:32px;">
  <div class="card" style="padding:28px; box-shadow:0 4px 16px rgba(0,0,0,0.08);">
    <h1 style="font-size:20px; font-weight:800; color:#111827; margin:0 0 8px;">Quên mật khẩu?</h1>
    <p style="font-size:13px; color:#6b7280; margin:0 0 20px; line-height:1.6;">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
    <form method="post" style="display:flex; flex-direction:column; gap:16px;">
      {% csrf_token %}
      <div>
        <label style="display:block; font-size:12px; font-weight:600; color:#374151; margin-bottom:4px;">Email</label>
        <input type="email" name="email" placeholder="email@example.com" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:10px;">Gửi link đặt lại</button>
    </form>
    <div style="margin-top:16px; text-align:center; font-size:13px;">
      <a href="/accounts/login/" style="color:#ea580c; text-decoration:none;">← Quay lại đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
