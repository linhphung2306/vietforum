{% extends 'base.html' %}
{% block title %}Sửa bài viết — VietForum{% endblock %}
{% block content %}

<div style="max-width:720px; margin:0 auto;">
  <h2 style="font-size:20px; font-weight:800; color:#111827; margin-bottom:20px;">✏ Chỉnh sửa bài viết</h2>
  <div class="card" style="padding:24px;">
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:16px;">
        <label style="font-size:14px; font-weight:600; color:#111827; display:block; margin-bottom:6px;">Nội dung</label>
        {{ form.content }}
        {% if form.content.errors %}
          <p style="font-size:12px; color:#ef4444; margin-top:4px;">{{ form.content.errors.0 }}</p>
        {% endif %}
      </div>
      <div style="display:flex; gap:12px;">
        <button type="submit" class="btn-primary" style="font-size:14px; padding:10px 20px;">Lưu thay đổi</button>
        <a href="{% url 'topics:topic_detail' topic_id=post.topic.id %}" class="btn-secondary" style="font-size:14px; padding:10px 20px; text-decoration:none;">Hủy</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
